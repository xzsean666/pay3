name = "pay3-frontend-test"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Local Wrangler dev can proxy to a local Pay3 API. For Cloudflare deploys,
# replace this with a staging API URL that Cloudflare can reach.
PAY3_API_BASE_URL = "https://home-10030.002788.xyz"

# Default mode is direct. The page still exposes an explicit browser-direct
# switch because this is a test console.
PAY3_DEFAULT_MODE = "direct"
PAY3_PROXY_ENABLED = "true"
PAY3_DIRECT_ENABLED = "true"

# Exposes the test JWT to the browser so the direct switch can be used.
# Set both PAY3_DIRECT_ENABLED and PAY3_EXPOSE_TEST_JWT to false for the
# normal non-direct test deployment posture.
PAY3_EXPOSE_TEST_JWT = "true"
PAY3_TEST_JWT_EXPIRES_AT = "9999-12-31T23:59:59Z"

# Permanent test JWT with all 5 scopes (orders + collections), expires in year 9999:
# iss=pay3, aud=pay3-api, kid=pay3-dev-key-1,
# secret=dev-dry-run-jwt-secret-000000000000666
# scopes=orders:create orders:read orders:verify collections:create collections:read
PAY3_TEST_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InBheTMtZGV2LWtleS0xIn0.eyJleHAiOjI1MzQwMjMwMDc5OSwibmJmIjoxNzAwMDAwMDAwLCJpYXQiOjE3MDAwMDAwMDAsImlzcyI6InBheTMiLCJhdWQiOiJwYXkzLWFwaSIsInN1YiI6ImxvY2FsLWRldi1jbGllbnQiLCJzY29wZSI6Im9yZGVyczpjcmVhdGUgb3JkZXJzOnJlYWQgb3JkZXJzOnZlcmlmeSBjb2xsZWN0aW9uczpjcmVhdGUgY29sbGVjdGlvbnM6cmVhZCJ9.Oae_tIyVz6ReptbA9WE7bLmSyHsXbauNANC3JTmxmlg"
