services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: pay3
      POSTGRES_PASSWORD: pay3_dev_password
      POSTGRES_DB: pay3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  signer:
    build:
      context: ./deploy/signer
      dockerfile: Dockerfile
    image: pay3-signer:local
    restart: unless-stopped
    profiles:
      - signer
    environment:
      SIGNER_HOST: 0.0.0.0
      SIGNER_PORT: 8088
      SIGNER_KEY_REF: ${SIGNER_KEY_REF:-pay3-master}
      SIGNER_AUTH_TOKEN: ${SIGNER_REMOTE_BEARER_TOKEN:-${SIGNER_AUTH_TOKEN:-}}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request, os; sys_token=os.getenv('SIGNER_AUTH_TOKEN', ''); req=urllib.request.Request('http://127.0.0.1:8088/healthz'); req.add_header('Authorization', f'Bearer {sys_token}') if sys_token else None; res=urllib.request.urlopen(req); exit(0 if res.getcode()==200 else 1)\"",
        ]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    ports:
      - "${SIGNER_PORT_BIND:-127.0.0.1:8088}:8088"

  pay3:
    build:
      context: .
      dockerfile: Dockerfile
    image: pay3:local
    restart: unless-stopped
    env_file:
      - ${PAY3_ENV_FILE:-.env.example}
    environment:
      APP_BIND: 0.0.0.0:3000
      DATABASE_URL: ${DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/readyz >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${PAY3_PORT:-3000}:3000"
